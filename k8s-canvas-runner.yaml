apiVersion: apps/v1
kind: Deployment
metadata:
  name: pages-canvas-kernel
  namespace: ai-sandboxes
  labels:
    app.kubernetes.io/name: pages-canvas-kernel
    app.kubernetes.io/part-of: dynamic-canvas-runtime
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pages-canvas-kernel
  template:
    metadata:
      labels:
        app: pages-canvas-kernel
    spec:
      containers:
      - name: canvas-kernel
        image: ghcr.io/pradeeptalari14/pages-canvas-kernel:v1.0.0
        ports:
        - containerPort: 8888
          name: kernel-rpc
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "2Gi"
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: pages-canvas-kernel
  namespace: ai-sandboxes
spec:
  type: ClusterIP
  selector:
    app: pages-canvas-kernel
  ports:
  - port: 8888
    targetPort: 8888
    name: kernel-rpc
